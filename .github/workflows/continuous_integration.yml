name: "Continuous Integration"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Continuous Integration
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ '3.12', '3.13', '3.14', '3.15' ]
    steps:
    - name: Repository Checkout
      uses: actions/checkout@v7
    - name: Python Setup
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          setup.cfg
    - name: Dependencies Installation
      run: |
        python -m pip install --quiet --upgrade pip
        python -m pip install --quiet --upgrade -r requirements.txt
        python -m pip install --quiet --upgrade -e ".[lint,docs,package,build,tests]"
    - name: Libraries Installation
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          sudo apt update --quiet --yes
          sudo apt-get install --quiet --yes graphviz
        elif [ "$RUNNER_OS" == "Windows" ]; then
          choco upgrade --limitoutput --yes chocolatey
          choco install --limitoutput --yes graphviz
        else
          brew update
          brew install graphviz
        fi
    - name: Linting
      if: runner.os == 'Linux'
      run: |
        python -m flake8 .
        python -m pylint docs/
        python -m pylint pydtmc/
        python -m pylint tests/
    - name: Documentation
      if: runner.os == 'Linux'
      run: |
        make -C docs/ doctest SPHINX_OPTS=-an
        make -C docs/ linkcheck SPHINX_OPTS=-an
        make -C docs/ coverage SPHINX_OPTS=-an
    - name: Build
      run: |
        python -m build
    - name: Testing
      env:
        COVERAGE_FILE: .coverage.${{ matrix.os }}.${{ matrix.python-version }}
      run: |
        python -m pytest --capture=no --benchmark-skip --cov --cov-config=setup.cfg tests/
    - name: Coverage Artifact Upload
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: |
          htmlcov/
          .coverage
          coverage.xml
          coverage.lcov
        include-hidden-files: true
        if-no-files-found: error
        overwrite: true
  coverage:
    name: Coverage
    needs: tests
    runs-on: ubuntu-latest
    env:
      COVERAGE_RCFILE: setup.cfg
    steps:
    - name: Repository Checkout
      uses: actions/checkout@v7
    - name: Python Setup
      uses: actions/setup-python@v7
      with:
        python-version: '3.15'
    - name: Dependencies Installation
      run: |
        python -m pip install --quiet --upgrade pip
        python -m pip install --quiet --upgrade coverage
    - name: Coverage Download
      uses: actions/download-artifact@v8
      with:
        pattern: coverage-data-*
        path: coverage/
        merge-multiple: true
    - name: Coverage Combination
      run: |
        python -m coverage combine coverage/
        python -m coverage report
        python -m coverage xml
        python -m coverage html
    - name: Coverage Upload
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: |
          .coverage
          coverage.xml
          htmlcov/
        include-hidden-files: true
        if-no-files-found: error
        overwrite: true
    - name: Coverage Submission
      uses: coverallsapp/github-action@v2
      with:
        format: lcov
        file: coverage.lcov