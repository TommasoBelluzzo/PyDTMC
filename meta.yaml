{% set data = load_setup_py_data(from_recipe_dir=True) %}
{% set name = data['name'] %}
{% set version = data['version'] %}
{% set summary = data['description'] %}
{% set description = data['long_description'][:data['long_description'].index('<table>')].strip() %}

package:
  name: {{ name.lower() }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0].lower() }}/{{ name.lower() }}/{{ name.lower() }}-{{ version }}.tar.gz
  sha256: 2600b964ab82b3f7f21ed54f56efeb8fac9313c1d660f2d22af5cac2f0a06d21

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python {{ data['python_requires'] }}
    - pip
    - setuptools >=77.0.3
  run:
    - python {{ data['python_requires'] }}
{% for dep in data['install_requires'] %}
{% if dep.lower().startswith('matplotlib') %}
    - {{ ('matplotlib-base ' ~ dep[10:].strip()).strip() }}
{% else %}
    - {{ dep.lower() }}
{% endif %}
{% endfor %}

test:
  imports:
    - {{ name.lower() }}
  source_files:
    - tests/
  requires:
    - pytest
  commands:
    - pytest tests/

about:
  home: {{ data['url'] }}
  license: {{ data['license'] }}
  license_file: {{ data['license_files'][0] }}
  summary: {{ summary }}
  description: {{ description }}
  doc_url: https://{{ name.lower() }}.readthedocs.io/
  doc_source_url: {{ data['url'] }}/blob/master/docs/source/index.rst
  dev_url: {{ data['url'] }}

extra:
  maintainers:
   - TommasoBelluzzo
