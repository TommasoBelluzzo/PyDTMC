[metadata]
name = PyDTMC
author = Tommaso Belluzzo
author_email = tommaso.belluzzo@gmail.com
maintainer = Tommaso Belluzzo
maintainer_email = tommaso.belluzzo@gmail.com
description = Python library for analyzing, simulating, and visualizing discrete-time Markov chains and hidden Markov models.
url = https://github.com/TommasoBelluzzo/PyDTMC
project_urls =
    Documentation = https://pydtmc.readthedocs.io/
    Bug Tracker = https://github.com/TommasoBelluzzo/PyDTMC/issues
    Donation = https://www.paypal.com/donate?hosted_button_id=D8LH6DNYN7EN8
license = MIT
license_files =
    LICENSE.md
platforms = any
classifiers =
    Development Status :: 5 - Production/Stable
    Natural Language :: English
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Intended Audience :: Developers
    Intended Audience :: Education
    Intended Audience :: Financial and Insurance Industry
    Intended Audience :: Science/Research
    Topic :: Education
    Topic :: Scientific/Engineering
    Topic :: Scientific/Engineering :: Mathematics
    Topic :: Scientific/Engineering :: Visualization
    Topic :: Software Development :: Libraries
    Topic :: Software Development :: Libraries :: Python Modules
    Topic :: Other/Nonlisted Topic
keywords =
    markov-chain
    markov-chains
    hidden-markov-model
    hidden-markov-models
    markov-model
    markov-models
    markov-state-model
    markov-state-models
    mathematics
    statistics
    probability
    stochastic-process
    stochastic-processes
    scientific-computing
    analysis
    simulation
    simulations
    plot
    plots
    plotting

[options]
python_requires = >=3.12
setup_requires =
    setuptools>=77.0.3
install_requires =
    matplotlib>=3.10
    networkx
    numpy
    scipy

[options.extras_require]
build =
    build
    setuptools
    wheel
    twine
docs =
    docutils
    typing-extensions
    sphinx
    sphinx-autodoc-typehints
    sphinx-rtd-theme
lint =
    flake8
    pylint
package =
    defusedxml
    numpydoc
    pandas
    pydot
tests =
    coverage
    pytest
    pytest-benchmark
    pytest-cov
    coveralls

[bdist_wheel]
universal = 0

[coverage:run]
omit =
    setup.py
    docs/*
    tests/*
    pydtmc/__init__.py
    pydtmc/base_classes.py
    pydtmc/custom_types.py
    pydtmc/decorators.py
    pydtmc/exceptions.py
    pydtmc/utilities.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __eq__
    def __hash__
    def __repr__
    def __str__
    if self\.debug

[flake8]
count = True
ignore =
    C901,
    E501,
    W605
exclude =
    build
max-complexity = 10
max-line-length = 120
statistics = True

[pylint]
max-line-length = 120

[pylint.'MESSAGES CONTROL']
disable =
    C0103,
    C0114,
    C0116,
    C0132,
    C0301,
    C0302,
    C0415,
    R0801,
    R0903,
    R0904,
    R0912,
    R0913,
    R0914,
    R0915,
    R0917,
    R1702,
    W0107,
    W0123,
    W0212,
    W0611,
    W0632,
    W0703,
    W1401,
    W1514
